<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Get in touch with the Pink Goose team.">
  <title>Contact | Pink Goose</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="icon" type="image/x-icon" href="assets/images/hidden-goose.png">
</head>

<body>
  <!-- topbar -->
  <header class="top">
    <a class="logo" href="index.html" aria-label="Pink Goose home">Pink <span>Goose</span></a>
    <nav aria-label="Main navigation">
      <ul class="nav">
        <li><a href="index.html">Home</a></li>
        <li><a href="learn.html">Learn</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
    <a class="login" href="#login">Login</a>
  </header>

  <main class="subpage">
    <section class="idea" id="contact" aria-labelledby="idea-title">
      <span class="idea-spark cyan-idea" aria-hidden="true">✦</span>
      <span class="idea-spark yellow-idea" aria-hidden="true">✦</span>
      <span class="idea-spark pink-idea" aria-hidden="true">✦</span>

      <h2 id="idea-title">What's your GOOSE idea?</h2>
      <p>Let’s chat and see how we can help</p>

      <div class="idea-buttons">
        <a class="idea-button telegram-button" href="https://t.me/superdao_team">
          <span class="idea-icon"><img src="assets/images/icon-telegram.svg" alt=""></span>
          <span><strong>Telegram</strong>@superdao_team</span>
        </a>
        <a class="idea-button email-button" href="mailto:hello@superdao.co">
          <span class="idea-icon"><img src="assets/images/icon-email.svg" alt=""></span>
          <span><strong>Email</strong>hello@superdao.co</span>
        </a>
      </div>
    </section>

    <section class="post-goose" aria-labelledby="post-title">
      <h2 id="post-title">Send a post Goose</h2>

      <form class="post-form" action="#contact-form" method="post">
        <label class="sr-only" for="post-email">Your email</label>
        <input id="post-email" name="email" type="email" autocomplete="email" placeholder="Your email" required>

        <label class="sr-only" for="post-name">Your name</label>
        <input id="post-name" name="name" type="text" autocomplete="name" placeholder="Your name" required>

        <label class="sr-only" for="post-message">Your message</label>
        <textarea id="post-message" name="message" rows="8" placeholder="Your message" required></textarea>

        <label class="sr-only" for="post-color">Color of your goose</label>
        <div class="post-select">
          <select id="post-color" name="color" required>
            <option value="" selected disabled>Color of your goose</option>
            <option value="red">Red</option>
            <option value="white">White</option>
            <option value="blue">Blue</option>
            <option value="black">Black</option>
          </select>
          <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
        </div>

        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <nav aria-label="Footer navigation">
        <ul class="footer-links">
          <li><a href="about.html">About</a></li>
          <li><a href="#jobs">Jobs</a></li>
          <li><a class="legal" href="#legal">Legal</a></li>
        </ul>
      </nav>

      <ul class="socials" aria-label="Social media">
        <li><a class="social twitter" href="#twitter" aria-label="Twitter"><img src="assets/images/footer-twitter.svg" alt=""></a></li>
        <li><a class="social telegram" href="https://t.me/superdao_team" aria-label="Telegram"><img src="assets/images/footer-telegram.svg" alt=""></a></li>
        <li><a class="social youtube" href="#youtube" aria-label="YouTube"><img src="assets/images/footer-youtube.svg" alt=""></a></li>
        <li><a class="social discord" href="#discord" aria-label="Discord"><img src="assets/images/footer-discord.svg" alt=""></a></li>
      </ul>
    </div>
  </footer>
</body>

</html>
